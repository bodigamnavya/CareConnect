<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CareConnect</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/auth.css">
    <link rel="stylesheet" href="CSS/responsive.css">
</head>
<body>

<header class="navbar">
    <div class="logo">
        <a href="index.html" style="display:flex; align-items:center; gap:8px; color:inherit; text-decoration:none;">
            <span>🚑</span>
            <strong>CareConnect</strong>
        </a>
    </div>
    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<main class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon">🔐</span>
            <h2>Welcome Back</h2>
            <p>Sign in to access your personal healthcare portal</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="loginEmail">Email Address</label>
                <input
                    type="email"
                    id="loginEmail"
                    class="form-control"
                    placeholder="name@example.com"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button
                type="submit"
                class="btn btn-primary"
                style="width:100%; margin-top:10px;"
            >
                Sign In
            </button>
        </form>

        <div id="loginMessage"></div>

        <div class="auth-footer">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </div>
    </div>
</main>

<footer>
    <p>© 2026 CareConnect. Healthcare Assistance Platform.</p>
</footer>

<script src="JS/config.js"></script>
<script src="JS/auth.js"></script>
</body>
</html>
