<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CareConnect</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        🚑 CareConnect
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
    </nav>

</header>

<main>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Welcome Back</h1>

            <p>
                Login to your CareConnect account to access
                your medical information securely.
            </p>

            <form id="loginForm">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <div id="loginMessage"></div>

            <p class="auth-link">
                Don't have an account?
                <a href="register.html">
                    Create Account
                </a>
            </p>

        </div>

    </div>

</main>

<footer>
    <p>© 2026 CareConnect.</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
