<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medical Profile - CareConnect</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        🚑 CareConnect
    </div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="qr-passport.html">Medical QR</a>
        <a href="sos-history.html">SOS History</a>
        <a href="#" id="logoutButton">Logout</a>
    </nav>

</header>

<main>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Medical Profile 🏥</h1>

            <p>
                Store important medical information for emergency situations.
            </p>

            <form id="medicalProfileForm">

                <label for="bloodGroup">
                    Blood Group
                </label>

                <select id="bloodGroup" required>

                    <option value="">
                        Select blood group
                    </option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>

                </select>


                <label for="phone">
                    Emergency Phone
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter emergency phone number"
                    required
                >


                <label for="allergies">
                    Allergies
                </label>

                <textarea
                    id="allergies"
                    rows="3"
                    placeholder="Example: Penicillin, peanuts"
                ></textarea>


                <label for="medications">
                    Current Medications
                </label>

                <textarea
                    id="medications"
                    rows="3"
                    placeholder="Enter current medications"
                ></textarea>


                <label for="conditions">
                    Medical Conditions
                </label>

                <textarea
                    id="conditions"
                    rows="3"
                    placeholder="Example: Asthma, diabetes"
                ></textarea>


                <label for="emergencyContact">
                    Emergency Contact Name
                </label>

                <input
                    type="text"
                    id="emergencyContact"
                    placeholder="Enter emergency contact name"
                    required
                >


                <button type="submit">
                    Save Medical Profile
                </button>

            </form>

            <div id="medicalMessage"></div>

            <p class="auth-link">

                <a href="dashboard.html">
                    ← Back to Dashboard
                </a>

            </p>

        </div>

    </div>

</main>

<footer>

    <p>
        © 2026 CareConnect. Emergency Medical Safety Platform.
    </p>

</footer>

<script src="js/script.js"></script>

</body>
</html>
