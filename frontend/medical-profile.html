```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Medical Profile - CareConnect</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- ==============================
         NAVIGATION BAR
    =============================== -->

    <header class="navbar">

        <div class="logo">
            🚑 CareConnect
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="history.html">
                History
            </a>

        </nav>

    </header>


    <!-- ==============================
         MEDICAL PROFILE
    =============================== -->

    <main>

        <div class="auth-container">

            <div class="auth-card">

                <h1>
                    Medical Profile 🏥
                </h1>

                <p>
                    Store important medical information
                    for emergency situations.
                </p>


                <form id="medicalProfileForm">


                    <!-- BLOOD GROUP -->

                    <label for="bloodGroup">
                        Blood Group
                    </label>

                    <select
                        id="bloodGroup"
                        name="blood_group"
                        required
                    >

                        <option value="">
                            Select blood group
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>


                    <!-- EMERGENCY PHONE -->

                    <label for="phone">
                        Emergency Phone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter emergency phone number"
                        required
                    >


                    <!-- ALLERGIES -->

                    <label for="allergies">
                        Allergies
                    </label>

                    <textarea
                        id="allergies"
                        name="allergies"
                        placeholder="Example: Penicillin, peanuts"
                        rows="3"
                    ></textarea>


                    <!-- MEDICATIONS -->

                    <label for="medications">
                        Current Medications
                    </label>

                    <textarea
                        id="medications"
                        name="medications"
                        placeholder="Enter current medications"
                        rows="3"
                    ></textarea>


                    <!-- MEDICAL CONDITIONS -->

                    <label for="conditions">
                        Medical Conditions
                    </label>

                    <textarea
                        id="conditions"
                        name="conditions"
                        placeholder="Example: Asthma, diabetes"
                        rows="3"
                    ></textarea>


                    <!-- EMERGENCY CONTACT -->

                    <label for="emergencyContact">
                        Emergency Contact Name
                    </label>

                    <input
                        type="text"
                        id="emergencyContact"
                        name="emergency_contact"
                        placeholder="Enter emergency contact name"
                        required
                    >


                    <!-- SAVE BUTTON -->

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Save Medical Profile
                    </button>

                </form>


                <!-- MESSAGE -->

                <div id="medicalMessage"></div>


                <!-- BACK TO DASHBOARD -->

                <p class="auth-link">

                    <a href="dashboard.html">
                        ← Back to Dashboard
                    </a>

                </p>

            </div>

        </div>

    </main>


    <!-- ==============================
         FOOTER
    =============================== -->

    <footer>

        <p>
            © 2026 CareConnect.
            Emergency Medical Safety Platform.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="js/script.js"></script>

</body>

</html>
