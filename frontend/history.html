<body>

<header>
    <h1>🚑 CareConnect</h1>
    <button class="back-btn" onclick="goDashboard()">Dashboard</button>
</header>

<div class="container">

    <div class="title">
        <h2>SOS History</h2>
        <p>View your previous emergency SOS alerts.</p>
    </div>

    <button class="refresh-btn" onclick="loadSOSHistory()">
        🔄 Refresh History
    </button>

    <div id="message"></div>

    <div id="historyContainer">
        <div class="loading">
            Loading SOS history...
        </div>
    </div>

</div>

<script>

    /*
       IMPORTANT:
       Change this URL if your Flask backend
       is running on another port/domain.
    */

    const API_BASE_URL = "http://127.0.0.1:5000";


    function showMessage(text, type) {

        const message = document.getElementById("message");

        message.textContent = text;
        message.className = type;
        message.style.display = "block";
    }


    function hideMessage() {

        const message = document.getElementById("message");

        message.style.display = "none";
    }


    function getToken() {

        return localStorage.getItem("token");
    }


    async function loadSOSHistory() {

        const container =
            document.getElementById("historyContainer");

        hideMessage();

        const token = getToken();

        if (!token) {

            showMessage(
                "Please login first.",
                "error"
            );

            container.innerHTML = `
                <div class="empty">
                    <h3>Login Required</h3>
                    <p>Please login to view SOS history.</p>
                </div>
            `;

            return;
        }


        container.innerHTML = `
            <div class="loading">
                Loading SOS history...
            </div>
        `;


        try {

            const response = await fetch(
                `${API_BASE_URL}/api/sos/history`,
                {
                    method: "GET",

                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    }
                }
            );


            const data = await response.json();


            if (response.status === 401) {

                showMessage(
                    "Session expired. Please login again.",
                    "error"
                );

                localStorage.removeItem("token");

                container.innerHTML = `
                    <div class="empty">
                        <h3>Session Expired</h3>
                        <p>Please login again.</p>
                    </div>
                `;

                return;
            }


            if (!data.success) {

                throw new Error(
                    data.message || "Unable to load SOS history."
                );
            }


            const events = data.events || [];


            if (events.length === 0) {

                container.innerHTML = `
                    <div class="empty">
                        <h3>No SOS History</h3>
                        <p>You have not activated any emergency SOS alerts yet.</p>
                    </div>
                `;

                return;
            }


            container.innerHTML = "";


            events.forEach((event, index) => {

                const date = event.created_at
                    ? new Date(event.created_at).toLocaleString()
                    : "Not available";


                const latitude =
                    event.latitude !== null &&
                    event.latitude !== undefined
                        ? event.latitude
                        : "Not available";


                const longitude =
                    event.longitude !== null &&
                    event.longitude !== undefined
                        ? event.longitude
                        : "Not available";


                const card = document.createElement("div");

                card.className = "event-card";


                card.innerHTML = `

                    <div class="event-header">

                        <h3>
                            Emergency SOS #${events.length - index}
                        </h3>

                        <span class="status">
                            ${event.status || "ACTIVE"}
                        </span>

                    </div>


                    <div class="event-details">

                        <p>
                            <strong>Message:</strong>
                            ${event.message || "Emergency SOS"}
                        </p>

                        <p>
                            <strong>Date & Time:</strong>
                            ${date}
                        </p>

                        <div class="coordinates">

                            <strong>Location</strong><br>

                            Latitude: ${latitude}<br>

                            Longitude: ${longitude}

                        </div>

                    </div>
                `;


                container.appendChild(card);

            });

        }

        catch (error) {

            console.error("SOS History Error:", error);


            showMessage(
                "Unable to connect to the server.",
                "error"
            );


            container.innerHTML = `
                <div class="empty">

                    <h3>Something went wrong</h3>

                    <p>
                        Please make sure the Flask backend
                        is running and try again.
                    </p>

                </div>
            `;
        }
    }


    function goDashboard() {

        window.location.href = "dashboard.html";
    }


    // Load history automatically
    // when page opens.

    document.addEventListener(
        "DOMContentLoaded",
        loadSOSHistory
    );

</script>

</body>
</html>
