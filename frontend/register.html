<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CareConnect</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        🚑 CareConnect
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>

</header>

<main>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p>
                Register to create your CareConnect account.
            </p>

            <form id="registerForm">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

            <div id="registerMessage"></div>

            <p class="auth-link">
                Already have an account?
                <a href="login.html">
                    Login
                </a>
            </p>

        </div>

    </div>

</main>

<footer>
    <p>© 2026 CareConnect.</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
