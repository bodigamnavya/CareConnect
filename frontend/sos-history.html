<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS History - CareConnect</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/dashboard.css">
    <link rel="stylesheet" href="CSS/responsive.css">
</head>
<body>

<header class="navbar">
    <div class="logo">
        <a href="dashboard.html" style="display:flex; align-items:center; gap:8px; color:inherit; text-decoration:none;">
            <span>🚑</span>
            <strong>CareConnect</strong>
        </a>
    </div>

    <nav class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="sos-history.html" class="active">SOS History</a>
        <a href="medical-profile.html">Medical Profile</a>
        <a href="ambulance.html">Ambulance</a>
        <a href="#" id="logoutButton" class="btn btn-secondary btn-sm" style="margin-left:5px;">Logout</a>
    </nav>
</header>

<main class="container" style="max-width:800px; margin:40px auto; padding:0 20px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; flex-wrap:wrap; gap:15px;">
        <div>
            <h1 style="font-size:28px; margin:0 0 6px;">Emergency SOS Broadcast History 🚨</h1>
            <p style="color:var(--text-muted); margin:0;">Real-time logs of recorded emergency signals, GPS locations, and distress status.</p>
        </div>
        <button id="sosButton" class="btn btn-primary" style="background:#dc2626; border-color:#dc2626; padding:10px 20px; font-weight:600; cursor:pointer;">
            🚨 Trigger New SOS
        </button>
    </div>

    <div id="sosMessage" style="margin-bottom:15px; font-weight:500;"></div>

    <div id="historyContainer" style="margin-top:20px;">
        <p style="color:var(--text-muted); text-align:center; padding:30px;">Loading SOS history...</p>
    </div>

    <div style="margin-top:25px; text-align:center;">
        <a href="dashboard.html" style="color:var(--primary-color);">← Back to Dashboard</a>
    </div>
</main>

<footer>
    <p>© 2026 CareConnect. Emergency Medical Safety Platform.</p>
</footer>

<script src="JS/config.js"></script>
<script src="JS/script.js"></script>
<script src="JS/auth.js"></script>
</body>
</html>
