services:
  - type: web
    name: careconnect-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app
    envVars:
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careconnect-db
          property: connectionString
      - key: FRONTEND_URL
        value: "*"
      - key: AI_MODEL
        value: gemini-1.5-flash
      - key: AI_API_KEY
        sync: false

databases:
  - name: careconnect-db
    databaseName: careconnect
    user: careconnect_user
    plan: free
